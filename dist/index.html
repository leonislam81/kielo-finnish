<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f2" />
    <meta name="description" content="Learn Finnish one small step at a time, with English or Bangla support and stories from Finland." />
    <title>Kielo — Learn Finnish, step by step</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="cafe.css" />
    <link rel="stylesheet" href="sounds.css" />
    <link rel="stylesheet" href="listening.css" />
    <link rel="stylesheet" href="reading.css" />
    <link rel="stylesheet" href="writing.css" />
    <link rel="stylesheet" href="grammar.css" />
    <script src="curriculum.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#home" aria-label="Kielo home">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 33V15M20 21c-8 0-12-5-12-11 7 0 12 3 12 10ZM20 25c8 0 12-5 12-11-7 0-12 3-12 10Z"/><path d="M15 33h10"/></svg></span>
          <span><strong>Kielo</strong><small>Learn Finnish, gently</small></span>
        </a>

        <div class="sidebar-caption">YOUR SPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-link active" data-page="home"><span class="nav-icon">⌂</span><span>Home</span></button>
          <button class="nav-link" data-page="path"><span class="nav-icon">↗</span><span>Learning path</span></button>
          <button class="nav-link" data-page="sounds"><span class="nav-icon">♫</span><span>Sound lab</span></button>
          <button class="nav-link" data-page="listening"><span class="nav-icon">◖</span><span>Listening</span></button>
          <button class="nav-link" data-page="reading"><span class="nav-icon">▤</span><span>Reading</span></button>
          <button class="nav-link" data-page="writing"><span class="nav-icon">✎</span><span>Writing</span></button>
          <button class="nav-link" data-page="grammar"><span class="nav-icon">⌘</span><span>Grammar lab</span></button>
          <button class="nav-link" data-page="practice"><span class="nav-icon">✳</span><span>Practice</span><span class="nav-count" id="word-count">0</span></button>
          <button class="nav-link" data-page="cafe"><span class="nav-icon">☕</span><span>Conversation</span></button>
          <button class="nav-link" data-page="culture"><span class="nav-icon">◌</span><span>Finland & media</span></button>
        </nav>

        <div class="sidebar-card">
          <span class="sidebar-card-icon">✿</span>
          <p class="eyebrow">A little, often</p>
          <p>Five calm minutes today can make tomorrow's Finnish feel closer.</p>
          <button class="text-button" data-page="practice">Start a quick review <span>↗</span></button>
        </div>

        <div class="sidebar-footer"><span class="status-dot"></span> Your progress stays on this device</div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
          <div class="topbar-context"><span class="weather-dot"></span><span>Learning from everywhere</span></div>
          <div class="topbar-actions">
            <div class="help-language"><span>Lesson help</span><button id="language-toggle" class="language-toggle" aria-label="Change lesson help language"><span data-lang-label="en">EN</span><span class="language-divider">/</span><span data-lang-label="bn">বাংলা</span></button></div>
            <div class="avatar" aria-label="Your learner profile">K</div>
          </div>
        </header>
        <main class="page-content" id="page-content" tabindex="-1"></main>
        <footer class="app-footer"><span>Made for curious learners, wherever home is.</span><span><a href="https://www.oph.fi/en/education-and-qualifications/selecting-right-yki-test-test-days" target="_blank" rel="noreferrer">Course levels follow the YKI / CEFR scale ↗</a></span></footer>
      </div>
    </div>

    <div class="modal-backdrop" id="lesson-backdrop" hidden>
      <section class="lesson-modal" id="lesson-modal" role="dialog" aria-modal="true" aria-labelledby="lesson-title">
        <div id="lesson-modal-content"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
